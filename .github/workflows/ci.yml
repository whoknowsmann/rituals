name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Run Expo diagnostics
        run: npm run doctor

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/preflight-expo-export
