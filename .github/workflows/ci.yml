name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Run Expo diagnostics
        run: npm run doctor

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/preflight-expo-export

  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned host Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.93.1

      - name: Cache Rust targets and Cargo registries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            program-tests/target
          key: rituals-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'program-tests/Cargo.lock') }}

      # Official Anza installer URL is pinned to the tested release. The
      # upstream binary artifacts remain trusted inputs after installation.
      - name: Install Solana CLI 3.0.13
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$installer" https://release.anza.xyz/v3.0.13/install
          printf '%s  %s\n' \
            dfab59a5773be04a284501f276a58a7856e2f42ae6ea68564140d0b3a56ce8c6 \
            "$installer" | sha256sum --check --strict
          sh "$installer"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI v0.31.1
        # Reviewed commit for the v0.31.1 tag.
        run: cargo install --git https://github.com/solana-foundation/anchor --rev 47284f8f0b9844c6b83234aa90f556bad00e12ed anchor-cli --locked

      - name: Verify program toolchain
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: Run native program tests
        run: cargo test --manifest-path program-tests/Cargo.toml --locked

      - name: Verify production workspace lock
        run: cargo build --locked --workspace

      - name: Build SBF program and IDL
        run: anchor build

      - name: Assert SBF and IDL artifacts
        run: |
          test -s target/deploy/rituals.so
          test -s target/idl/rituals.json
